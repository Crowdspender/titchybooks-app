name: Nightly database backup

# Second layer on top of Neon's point-in-time restore: a nightly logical dump
# retained as a workflow artifact for 30 days. Set the repository variable
# BACKUP_S3_BUCKET to also copy the dump off GitHub (requires the
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets and AWS_REGION and
# BACKUP_S3_BUCKET repository variables, all matching the destination bucket).
# Restore steps live in docs/operations-runbook.md.

on:
  schedule:
    # 02:30 UTC, outside the 5-minute queue drain cadence.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump and verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not configured"
            exit 1
          fi
          mkdir -p backup
          # pg_dump 17 can read older servers; running it in the matching
          # image avoids GitHub runner client/server version skew.
          docker run --rm -v "$PWD/backup:/backup" -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/titchybook.dump'
          test -s backup/titchybook.dump
          docker run --rm -v "$PWD/backup:/backup" postgres:17 \
            pg_restore --list /backup/titchybook.dump > /dev/null
          ls -lh backup/titchybook.dump
          echo "### Database backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h backup/titchybook.dump | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup/titchybook.dump
          retention-days: 30
          if-no-files-found: error

      - name: Copy to S3 (optional)
        if: ${{ vars.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          aws s3 cp backup/titchybook.dump \
            "s3://$BACKUP_S3_BUCKET/backups/postgres/$(date -u +%Y-%m-%dT%H-%M-%SZ).dump" \
            --sse AES256 --only-show-errors
