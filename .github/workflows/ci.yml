name: Reliability checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: titchybook_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: titchybook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U titchybook_test -d titchybook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://titchybook_test:local_test_only@127.0.0.1:5432/titchybook_test
      DATABASE_URL: postgresql://titchybook_test:local_test_only@127.0.0.1:5432/titchybook_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run test:db:migrate
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run test:pricing
      - run: npm test
      - run: npm run test:integration
      - run: node node_modules/tsx/dist/cli.mjs scripts/test-db.ts build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
